version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: documind_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: documind_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: documind_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  pgdata: